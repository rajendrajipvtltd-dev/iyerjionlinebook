<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Cricket News & Updates | Iyer Ji Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #030108; color: #ffffff; }
    .nav-bg { background: rgba(5, 3, 10, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(245, 158, 11, 0.2); }
    .text-orange-grad { background: linear-gradient(to right, #ea580c, #fef08a, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .news-card { background: rgba(20, 10, 40, 0.8); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 16px; overflow: hidden; transition: all 0.3s; display: flex; flex-direction: column; }
    .news-card:hover { transform: translateY(-5px); border-color: #f59e0b; box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
    .news-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid rgba(245, 158, 11, 0.2); }
  </style>
</head>
<body>
  
  <!-- NAVBAR -->
  <nav class="nav-bg sticky top-0 z-50 py-3">
    <div class="max-w-7xl mx-auto px-5 flex justify-between items-center">
      <a href="index.html"><img src="Logo.png" alt="IYER JI Logo" class="h-10 sm:h-12 w-auto"></a>
      <a href="index.html" class="text-amber-400 font-bold hover:text-white transition"><i class="fas fa-home"></i> Back to Home</a>
    </div>
  </nav>

  <!-- NEWS SECTION HEAD -->
  <section class="py-12 px-5 max-w-6xl mx-auto">
    <div class="text-center mb-10">
      <span class="bg-amber-500/20 text-amber-400 font-bold text-xs uppercase px-4 py-1.5 rounded-full border border-amber-500/40">
        🔴 Auto-Updated Daily
      </span>
      <h1 class="text-3xl sm:text-4xl font-black mt-4 text-orange-grad uppercase"><i class="fas fa-newspaper mr-2"></i> Live Cricket News</h1>
      <p class="text-gray-400 mt-2">Get the latest cricket updates, match previews, and breaking news directly on Iyer Ji Club.</p>
    </div>

    <!-- LOADER -->
    <div id="loader" class="text-center text-amber-400 py-10 font-bold text-xl">
      <i class="fas fa-spinner fa-spin mr-2"></i> Fetching Latest News...
    </div>

    <!-- NEWS GRID (Auto Populated by JS) -->
    <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
      <!-- Cards will appear here automatically -->
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-black py-6 text-center border-t border-amber-500/20 mt-10">
    <p class="text-xs text-gray-500">© <span id="year"></span> Iyer Ji Club. All Rights Reserved.</p>
  </footer>

  <!-- SCRIPT FOR AUTOMATIC LIVE NEWS -->
  <script>
    document.getElementById('year').innerText = new Date().getFullYear();

    // Fetching Live Cricket News via Open RSS to JSON API
    async function fetchCricketNews() {
      // Using ESPNcricinfo global news RSS converted to JSON
      const rssUrl = 'https://www.espncricinfo.com/rss/content/story/feeds/0.xml';
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&api_key=`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok') {
          document.getElementById('loader').classList.add('hidden');
          const newsContainer = document.getElementById('news-container');
          newsContainer.classList.remove('hidden');

          // Sirf top 9 news dikhayenge
          const articles = data.items.slice(0, 9);

          articles.forEach(article => {
            // Check agar image nahi hai to default cricket image dikhaye
            const imgUrl = article.thumbnail || article.enclosure.link || 'https://images.unsplash.com/photo-1531415074968-036ba1b575da?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';
            
            // Date Format
            const pubDate = new Date(article.pubDate).toLocaleDateString('en-IN', {
              day: 'numeric', month: 'short', year: 'numeric'
            });

            const cardHtml = `
              <div class="news-card">
                <img src="${imgUrl}" alt="Cricket News" class="news-img">
                <div class="p-5 flex flex-col flex-grow">
                  <span class="text-[10px] font-bold text-amber-500 uppercase tracking-widest mb-2"><i class="far fa-clock mr-1"></i> ${pubDate}</span>
                  <h3 class="text-lg font-black text-white leading-tight mb-3">${article.title}</h3>
                  <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="mt-auto inline-block text-center border border-amber-500 text-amber-400 hover:bg-amber-500 hover:text-black font-bold text-xs py-2 px-4 rounded transition">
                    Read Full News <i class="fas fa-arrow-right ml-1"></i>
                  </a>
                </div>
              </div>
            `;
            newsContainer.innerHTML += cardHtml;
          });
        }
      } catch (error) {
        document.getElementById('loader').innerHTML = '<span class="text-red-500">Failed to load news. Please try again later.</span>';
      }
    }

    // Call the function on page load
    fetchCricketNews();
  </script>
</body>
</html>
